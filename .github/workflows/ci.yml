name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android and shared
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check architecture boundaries
        run: ./scripts/check-layer-boundaries.sh

      - name: Test, analyze, and build Android
        run: >
          ./gradlew
          :shared:testAndroidHostTest
          :shared:detektShared
          :shared:compileAndroidMain
          :androidApp:assembleDebug

  ios:
    name: iOS framework
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile and link iOS framework
        run: >
          ./gradlew
          :shared:compileKotlinIosSimulatorArm64
          :shared:linkDebugFrameworkIosSimulatorArm64
