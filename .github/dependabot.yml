version: 2

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 6
    labels:
      - "dependencies"
    groups:
      kotlin-compose:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.compose*"
      android:
        patterns:
          - "com.android.*"
          - "androidx.*"
          - "org.jetbrains.androidx.*"
      kotlinx:
        patterns:
          - "org.jetbrains.kotlinx*"
      data-and-di:
        patterns:
          - "app.cash.sqldelight*"
          - "io.insert-koin*"
      tooling:
        patterns:
          - "io.gitlab.arturbosch.detekt*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:30"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
