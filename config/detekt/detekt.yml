build:
  maxIssues: 0

complexity:
  LongMethod:
    active: true
    threshold: 80
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 9
    ignoreDefaultParameters: false
    ignoreDataClasses: true
  LargeClass:
    active: true
    threshold: 700
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    active: false
  ComplexCondition:
    active: false

style:
  WildcardImport:
    active: false
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  ForbiddenComment:
    active: false
  UnusedParameter:
    active: false
  UnusedPrivateProperty:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false

naming:
  FunctionNaming:
    active: true
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
  MatchingDeclarationName:
    active: false

coroutines:
  InjectDispatcher:
    active: false
